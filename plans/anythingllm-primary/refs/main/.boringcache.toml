workspace = "boringcache/docker-cache-proof"

[adapters.docker]
tag = "docker-cache-proof-anythingllm-primary"
no-platform = true
no-git = true
fail-on-cache-error = true
metadata-hints = ["benchmark=docker-cache-proof", "case=anythingllm-primary", "source-ref=main"]
command = [
  "docker",
  "buildx",
  "build",
  "--file",
  "../../../../.work/anythingllm-primary/source/docker/Dockerfile",
  "--platform",
  "linux/amd64,linux/arm64",
  "--sbom=true",
  "--provenance=mode=max",
  "--push",
  "--tag",
  "ghcr.io/boringcache/anythingllm-primary-proof:main",
  "../../../../.work/anythingllm-primary/source/.",
]
