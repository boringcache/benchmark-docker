workspace = "boringcache/docker-cache-proof"

[adapters.docker]
tag = "docker-cache-proof-tiled-container-canary"
no-platform = true
no-git = true
fail-on-cache-error = true
metadata-hints = ["benchmark=docker-cache-proof", "case=tiled-container-canary", "source-ref=main"]
command = [
  "docker",
  "buildx",
  "build",
  "--file",
  "../../../../.work/tiled-container-canary/source/Containerfile",
  "--platform",
  "linux/amd64,linux/arm64",
  "--build-arg",
  "TILED_VERSION=0.0.0+14a4368c35e24172d008e8b0486a15d804010b9a",
  "--provenance=mode=max",
  "--tag",
  "cache-proof/tiled-container-canary:main",
  "../../../../.work/tiled-container-canary/source/.",
]
