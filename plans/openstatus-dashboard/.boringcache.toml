workspace = "boringcache/docker-cache-proof"

[adapters.docker]
tag = "docker-cache-proof-openstatus-dashboard"
no-platform = true
no-git = true
fail-on-cache-error = true
metadata-hints = ["benchmark=docker-cache-proof", "case=openstatus-dashboard"]
command = [
  "docker",
  "buildx",
  "build",
  "--file",
  "../../.work/openstatus-dashboard/source/apps/dashboard/Dockerfile",
  "--platform",
  "linux/amd64,linux/arm64",
  "--provenance=false",
  "--push",
  "--tag",
  "ghcr.io/boringcache/openstatus-dashboard-proof:main",
  "../../.work/openstatus-dashboard/source/.",
]
