  "linux/amd64",
  "--build-arg",
  "GIT_COMMIT_SHA=a204400d1a46137dcf53e7f34ec3508b7b0eed3e",
  "--build-arg",
  "GIT_TAG=",
  "--push",
  "--tag",
  "ghcr.io/boringcache/blockscout-frontend-proof:rolling2",
  "../../../../.work/blockscout-frontend/source/.",
]
