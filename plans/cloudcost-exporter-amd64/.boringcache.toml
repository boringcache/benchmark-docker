command = [
  "docker",
  "buildx",
  "build",
  "--file",
  "../../.work/cloudcost-exporter-amd64/source/Dockerfile",
  "--platform",
  "linux/amd64",
  "--tag",
  "cache-proof/cloudcost-exporter-amd64:main",
  "../../.work/cloudcost-exporter-amd64/source/.",
]
