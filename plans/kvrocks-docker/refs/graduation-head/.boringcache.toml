  "docker",
  "buildx",
  "build",
  "--file",
  "../../../../.work/kvrocks-docker/source/Dockerfile",
  "--platform",
  "linux/amd64",
  "--tag",
  "cache-proof/kvrocks:graduation-head",
  "../../../../.work/kvrocks-docker/source/.",
]
