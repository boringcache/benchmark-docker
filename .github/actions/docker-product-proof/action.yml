name: "Run Docker product proof phase"
description: "Runs one real Docker workload through BoringCache."
inputs:
  cache_lane: {required: true}
  phase: {required: true}
  case_id: {required: true}
  case_ref_key: {required: true}
  benchmark_id: {required: true}
  cache_id: {required: true}
  fidelity_level: {required: true}
  plan_directory: {required: true}
  dockerfile_path: {required: true}
  docker_context: {required: true}
  image_repository: {required: true}
  image_tag: {required: true}
  target: {required: false, default: ""}
  platforms: {required: false, default: ""}
  build_args: {required: false, default: ""}
  docker_tool_cache: {required: false, default: ""}
  sbom: {required: false, default: "false"}
  provenance: {required: false, default: "false"}
  cli_version: {required: false, default: ""}
  cli_platform: {required: true}
  free_disk_space: {required: false, default: "false"}
  setup_qemu: {required: false, default: "false"}
  build_output: {required: true}
  buildkit_image: {required: false, default: ""}
  cache_scope_suffix: {required: false, default: ""}
  rust_target_cache: {required: false, default: "false"}
runs:
  using: composite
  steps:
    - name: Free runner disk space
      if: inputs.free_disk_space == 'true'
      shell: bash
      run: ./scripts/free-runner-disk.sh
    - name: Set up the plan runtime
      uses: actions/setup-python@v6
      with:
        python-version: "3.13"
    - name: Prepare the pinned workload
      shell: bash
      run: ./scripts/prepare-case-source.sh "${{ inputs.case_id }}" "${{ inputs.case_ref_key }}"
    - name: Verify the pinned upstream workflow anchor
      shell: bash
      run: >-
        python3 ./scripts/verify-upstream-recipe.py
        --case "${{ inputs.case_id }}"
        --source ".work/${{ inputs.case_id }}/source"
    - name: Select the cache cohort
      id: scope
      shell: bash
      env:
        CACHE_LANE: ${{ inputs.cache_lane }}
        CACHE_ID: ${{ inputs.cache_id }}
        REQUESTED_TOOL_CACHE: ${{ inputs.docker_tool_cache }}
        SCOPE_SUFFIX: ${{ inputs.cache_scope_suffix }}
        PLAN_DIRECTORY: ${{ inputs.plan_directory }}
        IMAGE_REPOSITORY: ${{ inputs.image_repository }}
        IMAGE_TAG: ${{ inputs.image_tag }}
        BENCHMARK_ID: ${{ inputs.benchmark_id }}
        CASE_ID: ${{ inputs.case_id }}
        FIDELITY_LEVEL: ${{ inputs.fidelity_level }}
        PHASE: ${{ inputs.phase }}
        RUST_TARGET_CACHE: ${{ inputs.rust_target_cache }}
        PLATFORMS: ${{ inputs.platforms }}
      run: |
        set -euo pipefail
        ref_slug="$(printf '%s' "$GITHUB_REF_NAME" | tr -c 'A-Za-z0-9._-' '-')"
        ref_slug="${ref_slug#-}"
        ref_slug="${ref_slug%-}"
        ref_slug="${ref_slug:-main}"
        if [[ "$CACHE_LANE" == "rolling" ]]; then cache_scope="${CACHE_ID}-rolling-${ref_slug}${SCOPE_SUFFIX}"; else cache_scope="${CACHE_ID}-run-r${GITHUB_RUN_ID}-a${GITHUB_RUN_ATTEMPT}${SCOPE_SUFFIX}"; fi
        ./scripts/scope-boringcache-run.sh "$cache_scope" "$PLAN_DIRECTORY"
        docker_tool_cache="${REQUESTED_TOOL_CACHE//\{CACHE_SCOPE\}/$cache_scope}"
        if [[ "$CACHE_LANE" == "rolling" ]]; then metadata_phase="rolling"; elif [[ "$PHASE" == "publish" ]]; then metadata_phase="fresh-cold"; else metadata_phase="fresh-warm"; fi
        configure_args=(
          --plan-directory "$PLAN_DIRECTORY"
          --cache-scope "$cache_scope"
          --image-repository "$IMAGE_REPOSITORY"
          --image-tag "$IMAGE_TAG"
          --metadata-hint "benchmark=$BENCHMARK_ID"
          --metadata-hint "case=$CASE_ID"
          --metadata-hint "fidelity=$FIDELITY_LEVEL"
          --metadata-hint "phase=$metadata_phase"
        )
        [[ -z "$docker_tool_cache" ]] || configure_args+=(--tool-cache "$docker_tool_cache")
        [[ -z "$PLATFORMS" ]] || configure_args+=(--platform "$PLATFORMS")
        [[ "$RUST_TARGET_CACHE" != "true" ]] || configure_args+=(--mount-cache --no-cache)
        python3 ./scripts/configure-boringcache-plan.py "${configure_args[@]}"
        {
          echo "cache_scope=${cache_scope}"
          echo "docker_tool_cache<<EOF"
          echo "$docker_tool_cache"
          echo "EOF"
        } >> "$GITHUB_OUTPUT"
    - name: Set up QEMU
      if: inputs.setup_qemu == 'true'
      uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
    - name: Log in for an image push
      if: inputs.build_output == 'ghcr'
      uses: docker/login-action@v4.2.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}
    - name: Publish BoringCache on the real Docker workload
      if: inputs.phase == 'publish'
      uses: boringcache/one@20202f4c4b789cdee581ae3f117dfafb8293b19c # v1 / 1.20.0
      env:
        BORINGCACHE_MANAGED_BUILDKIT_IMAGE: ${{ inputs.buildkit_image }}
      with:
        cli-version: ${{ inputs.cli_version }}
        cli-platform: ${{ inputs.cli_platform }}
        mode: docker
        trust-policy: publish
        fail-on-cache-error: true
        working-directory: ${{ inputs.plan_directory }}
    - name: Restore BoringCache on a fresh runner
      if: inputs.phase == 'warm'
      uses: boringcache/one@20202f4c4b789cdee581ae3f117dfafb8293b19c # v1 / 1.20.0
      env:
        BORINGCACHE_MANAGED_BUILDKIT_IMAGE: ${{ inputs.buildkit_image }}
      with:
        cli-version: ${{ inputs.cli_version }}
        cli-platform: ${{ inputs.cli_platform }}
        mode: docker
        trust-policy: restore
        fail-on-cache-miss: true
        fail-on-cache-error: true
        working-directory: ${{ inputs.plan_directory }}
    - name: Verify the loaded image
      if: inputs.build_output == 'load'
      shell: bash
      run: docker image inspect "${{ inputs.image_repository }}:${{ inputs.image_tag }}" >/dev/null
