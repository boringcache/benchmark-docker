workspace = "boringcache/docker-cache-proof"

[adapters.docker]
tag = "docker-cache-proof-misskey-develop-amd64"
no-platform = true
no-git = true
fail-on-cache-error = true
metadata-hints = ["benchmark=docker-cache-proof", "case=misskey-develop-amd64"]
command = [
  "docker",
  "buildx",
  "build",
  "--file",
  "../../.work/misskey-develop-amd64/source/Dockerfile",
  "--platform",
  "linux/amd64",
  "--provenance=false",
  "--push",
  "--tag",
  "ghcr.io/boringcache/misskey-develop-amd64-proof:main",
  "../../.work/misskey-develop-amd64/source/.",
]
