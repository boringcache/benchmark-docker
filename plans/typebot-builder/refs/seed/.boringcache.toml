workspace = "boringcache/docker-cache-proof"

[adapters.docker]
tag = "docker-cache-proof-typebot-builder"
no-platform = true
no-git = true
fail-on-cache-error = true
metadata-hints = ["benchmark=docker-cache-proof", "case=typebot-builder", "source-ref=seed"]
command = [
  "docker",
  "buildx",
  "build",
  "--file",
  "../../../../.work/typebot-builder/source/Dockerfile",
  "--platform",
  "linux/amd64",
  "--build-arg",
  "SCOPE=builder",
  "--push",
  "--tag",
  "ghcr.io/boringcache/typebot-builder-proof:seed",
  "../../../../.work/typebot-builder/source/.",
]
