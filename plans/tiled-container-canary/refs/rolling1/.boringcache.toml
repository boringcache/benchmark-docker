workspace = "boringcache/docker-cache-proof"

[adapters.docker]
tag = "docker-cache-proof-tiled-container-canary"
no-platform = true
no-git = true
fail-on-cache-error = true
metadata-hints = ["benchmark=docker-cache-proof", "case=tiled-container-canary", "source-ref=rolling1"]
command = [
  "docker",
  "buildx",
  "build",
  "--file",
  "../../../../.work/tiled-container-canary/source/Containerfile",
  "--platform",
  "linux/amd64,linux/arm64",
  "--build-arg",
  "TILED_VERSION=0.0.0+1d2b1c53205cb807628d5f96751189f4cd942463",
  "--provenance=mode=max",
  "--tag",
  "cache-proof/tiled-container-canary:rolling1",
  "../../../../.work/tiled-container-canary/source/.",
]
