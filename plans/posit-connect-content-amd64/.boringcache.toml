workspace = "boringcache/docker-cache-proof"

[adapters.docker]
tag = "docker-cache-proof-posit-connect-content-amd64"
no-platform = true
no-git = true
fail-on-cache-error = true
metadata-hints = ["benchmark=docker-cache-proof", "case=posit-connect-content-amd64"]
command = [
  "docker",
  "buildx",
  "build",
  "--file",
  "../../.work/posit-connect-content-amd64/source/connect-content/matrix/Containerfile.ubuntu2404.base",
  "--platform",
  "linux/amd64",
  "--build-arg",
  "PYTHON_VERSION=3.14.6",
  "--build-arg",
  "R_VERSION=4.6.1",
  "--build-arg",
  "QUARTO_VERSION=1.10.18",
  "--push",
  "--tag",
  "ghcr.io/boringcache/posit-connect-content-amd64-proof:main",
  "../../.work/posit-connect-content-amd64/source/.",
]
