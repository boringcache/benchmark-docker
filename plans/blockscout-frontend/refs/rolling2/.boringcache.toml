no-git = true
fail-on-cache-error = true
metadata-hints = ["benchmark=docker-cache-proof", "case=blockscout-frontend", "source-ref=rolling2"]
command = [
  "docker",
  "buildx",
  "build",
  "--file",
  "../../../../.work/blockscout-frontend/source/Dockerfile",
