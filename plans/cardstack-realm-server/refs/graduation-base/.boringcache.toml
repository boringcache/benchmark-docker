workspace = "boringcache/docker-cache-proof"

[adapters.docker]
tag = "docker-cache-proof-cardstack-realm-server"
no-platform = true
no-git = true
fail-on-cache-error = true
metadata-hints = ["benchmark=docker-cache-proof", "case=cardstack-realm-server", "source-ref=graduation-base"]
command = [
  "docker",
  "buildx",
  "build",
  "--file",
  "../../../../.work/cardstack-realm-server/source/packages/realm-server/realm-server.Dockerfile",
  "--build-arg",
  "realm_server_script=start:staging",
  "--push",
  "--tag",
  "ghcr.io/boringcache/cardstack-realm-server-proof:graduation-base",
  "../../../../.work/cardstack-realm-server/source/.",
]
