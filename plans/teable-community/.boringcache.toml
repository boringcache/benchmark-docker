workspace = "boringcache/docker-cache-proof"

[adapters.docker]
tag = "docker-cache-proof-teable-community"
no-platform = true
no-git = true
fail-on-cache-error = true
metadata-hints = ["benchmark=docker-cache-proof", "case=teable-community"]
command = [
  "docker",
  "buildx",
  "build",
  "--file",
  "../../.work/teable-community/source/dockers/teable/Dockerfile",
  "--platform",
  "linux/amd64",
  "--build-arg",
  "ENABLE_CSP=false",
  "--build-arg",
  "BUILD_VERSION=6a69cfc84b8884e2dd3e40cd62e51292b1c9883f",
  "--push",
  "--tag",
  "ghcr.io/boringcache/teable-community-proof:main",
  "../../.work/teable-community/source/.",
]
