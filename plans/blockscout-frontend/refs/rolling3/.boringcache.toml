  "GIT_COMMIT_SHA=3e8f4939ab7b33311d5ebc591bad03ec1bcb597c",
  "--build-arg",
  "GIT_TAG=",
  "--push",
  "--tag",
  "ghcr.io/boringcache/blockscout-frontend-proof:rolling3",
  "../../../../.work/blockscout-frontend/source/.",
]
