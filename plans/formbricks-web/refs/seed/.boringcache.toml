workspace = "boringcache/docker-cache-proof"

[adapters.docker]
tag = "docker-cache-proof-formbricks-web"
no-platform = true
no-git = true
fail-on-cache-error = true
metadata-hints = ["benchmark=docker-cache-proof", "case=formbricks-web", "source-ref=seed"]
command = [
  "docker",
  "buildx",
  "build",
  "--file",
  "../../../../.work/formbricks-web/source/apps/web/Dockerfile",
  "--platform",
  "linux/amd64",
  "--load",
  "--tag",
  "cache-proof/formbricks-web:seed",
  "../../../../.work/formbricks-web/source/.",
]
