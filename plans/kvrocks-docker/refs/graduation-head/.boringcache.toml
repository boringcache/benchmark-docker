workspace = "boringcache/docker-cache-proof"

[adapters.docker]
tag = "docker-cache-proof-kvrocks-docker"
no-platform = true
no-git = true
fail-on-cache-error = true
metadata-hints = ["benchmark=docker-cache-proof", "case=kvrocks-docker", "source-ref=graduation-head"]
