workspace = "boringcache/docker-cache-proof"

[adapters.docker]
tag = "docker-cache-proof-umami-release"
no-platform = true
no-git = true
fail-on-cache-error = true
metadata-hints = ["benchmark=docker-cache-proof", "case=umami-release", "source-ref=main"]
command = [
  "docker",
  "buildx",
  "build",
  "--file",
  "../../../../.work/umami-release/source/Dockerfile",
  "--platform",
  "linux/amd64,linux/arm64",
  "--push",
  "--tag",
  "ghcr.io/boringcache/umami-release-proof:main",
  "../../../../.work/umami-release/source/.",
]
