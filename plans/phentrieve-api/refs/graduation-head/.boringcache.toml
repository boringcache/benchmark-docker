workspace = "boringcache/docker-cache-proof"

[adapters.docker]
tag = "docker-cache-proof-phentrieve-api"
no-platform = true
no-git = true
fail-on-cache-error = true
metadata-hints = ["benchmark=docker-cache-proof", "case=phentrieve-api", "source-ref=graduation-head"]
command = [
  "docker",
  "buildx",
  "build",
  "--file",
  "../../../../.work/phentrieve-api/source/api/Dockerfile",
  "--platform",
  "linux/amd64",
  "--build-arg",
  "BUNDLE_URL=https://github.com/berntpopp/phentrieve/releases/download/data-v2026-02-16/phentrieve-data-v2026-02-16-biolord-multivec.tar.gz",
  "--build-arg",
  "BUILD_INDEXES=false",
  "--push",
  "--tag",
  "ghcr.io/boringcache/phentrieve-api-proof:graduation-head",
  "../../../../.work/phentrieve-api/source/.",
]
