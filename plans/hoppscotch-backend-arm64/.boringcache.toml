workspace = "boringcache/docker-cache-proof"

[adapters.docker]
tag = "docker-cache-proof-hoppscotch-backend-arm64"
no-platform = true
no-git = true
fail-on-cache-error = true
metadata-hints = ["benchmark=docker-cache-proof", "case=hoppscotch-backend-arm64"]
command = [
  "docker",
  "buildx",
  "build",
  "--file",
  "../../.work/hoppscotch-backend-arm64/source/prod.Dockerfile",
  "--platform",
  "linux/arm64",
  "--target",
  "backend",
  "--push",
  "--tag",
  "ghcr.io/boringcache/hoppscotch-backend-arm64-proof:main",
  "../../.work/hoppscotch-backend-arm64/source/.",
]
