  "linux/amd64",
  "--target",
  "release",
  "--build-arg",
  "GIT_SHA=7319a90303280e1175f5ad4cb48500a58da63cc1",
  "--push",
  "--tag",
  "ghcr.io/boringcache/mozilla-bedrock-release-proof:seed",
  "../../../../.work/mozilla-bedrock-release/source/.",
]
