workspace = "boringcache/docker-cache-proof"

[adapters.docker]
tag = "docker-cache-proof-nmisp-nightly"
no-platform = true
no-git = true
fail-on-cache-error = true
metadata-hints = ["benchmark=docker-cache-proof", "case=nmisp-nightly", "source-ref=graduation-base"]
command = [
  "docker",
  "buildx",
  "build",
  "--file",
  "../../../../.work/nmisp-nightly/source/docker/Dockerfile.nmisp-test",
  "--platform",
  "linux/amd64",
  "--build-arg",
  "ENV_VARIANT=nightly",
  "--push",
  "--tag",
  "ghcr.io/boringcache/nmisp-nightly-proof:graduation-base",
  "../../../../.work/nmisp-nightly/source/.",
]
